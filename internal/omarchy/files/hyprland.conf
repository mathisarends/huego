# huego keybindings, written by `huego omarchy install`. Reinstalling
# overwrites this file; pick other keys with --modifier or edit a copy.
# "e" repeats while held, "l" works on the lock screen, "d" adds the
# description shown in Omarchy's keybinding list.
bindd = {{MOD}}, H, Toggle lights, exec, huego home toggle
bindeld = {{MOD}}, EQUAL, Brighten lights, exec, huego home brighten 10
bindeld = {{MOD}}, MINUS, Dim lights, exec, huego home dim 10
bindd = {{MOD}}, S, Pick light scene, exec, huego scene pick --notify

# Per room:
# bindd = {{MOD}}, O, Toggle office lights, exec, huego room toggle Office
