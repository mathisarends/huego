# Append to ~/.config/hypr/bindings.conf and adjust keys that collide with
# your own bindings. "e" repeats while held, "d" adds a description.
bindd = SUPER CTRL, L, Toggle lights, exec, huego home toggle
bindeld = SUPER CTRL, EQUAL, Brighten lights, exec, huego home brighten 10
bindeld = SUPER CTRL, MINUS, Dim lights, exec, huego home dim 10
bindd = SUPER CTRL SHIFT, L, Pick light scene, exec, huego-scene-picker

# Per room:
# bindd = SUPER CTRL, O, Toggle office lights, exec, huego room toggle Office
